<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base: #0d0d0d;
      --bg-surface: #161616;
      --bg-elevated: #1e1e1e;
      --bg-input: #252525;
      --border: #2e2e2e;
      --border-subtle: #222;
      --text-primary: #ececec;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --user-bubble: #1e3a5f;
      --user-bubble-border: #2a4d7a;
      --error-bg: #2d1515;
      --error-border: #7f1d1d;
      --error-text: #fca5a5;
      --success: #22c55e;
    }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      height: 56px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 1rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 600;
      font-size: 1rem;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .header-left svg { color: var(--accent); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* Model selector */
    .model-select {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }
    .model-select:hover, .model-select:focus { border-color: var(--accent); }

    /* User chip */
    .user-chip {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.75rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 99px;
      font-size: 0.82rem;
      color: var(--text-secondary);
      max-width: 200px;
      overflow: hidden;
    }

    .avatar {
      width: 26px; height: 26px;
      background: var(--accent);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }

    .user-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-logout:hover { border-color: #f87171; color: #f87171; }

    /* ── Chat area ───────────────────────────────────────────────────── */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      scroll-behavior: smooth;
    }

    .chat-container::-webkit-scrollbar { width: 6px; }
    .chat-container::-webkit-scrollbar-track { background: transparent; }
    .chat-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Message wrapper */
    .message-row {
      display: flex;
      gap: 0.75rem;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    .message-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .msg-avatar.user-av { background: var(--accent); color: #fff; }
    .msg-avatar.bot-av  { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-secondary); }

    .message-bubble {
      padding: 0.75rem 1rem;
      border-radius: 14px;
      line-height: 1.65;
      font-size: 0.9rem;
      max-width: calc(100% - 50px);
      word-break: break-word;
    }

    .message-row.user .message-bubble {
      background: var(--user-bubble);
      border: 1px solid var(--user-bubble-border);
      border-bottom-right-radius: 4px;
      color: var(--text-primary);
    }

    .message-row.assistant .message-bubble {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-bottom-left-radius: 4px;
      color: var(--text-primary);
    }

    .message-bubble.error-bubble {
      background: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error-text);
    }

    /* Streaming cursor */
    .cursor {
      display: inline-block;
      width: 2px; height: 1em;
      background: var(--text-secondary);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Typing indicator */
    .typing-dots { display: flex; gap: 4px; align-items: center; padding: 0.1rem 0; }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      flex: 1;
      color: var(--text-muted);
      text-align: center;
      padding: 2rem;
    }
    .empty-state svg { opacity: 0.25; }
    .empty-state p { font-size: 0.9rem; max-width: 280px; line-height: 1.5; }

    /* ── Toolbar ─────────────────────────────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 1.25rem;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      gap: 0.75rem;
    }

    .toolbar-left { display: flex; align-items: center; gap: 0.75rem; }

    .btn-clear {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .btn-clear:hover { border-color: #f87171; color: #f87171; }

    .history-control {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.8rem; color: var(--text-muted);
    }

    .history-select {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.3rem 0.5rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      outline: none;
    }
    .history-select:hover, .history-select:focus { border-color: var(--accent); }

    .msg-count {
      font-size: 0.75rem; color: var(--text-muted);
    }

    /* ── Input area ──────────────────────────────────────────────────── */
    .input-area {
      padding: 0.75rem 1.25rem 1rem;
      background: var(--bg-surface);
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 0.75rem;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.6rem 0.6rem 0.6rem 1rem;
      transition: border-color 0.15s;
      max-width: 800px;
      margin: 0 auto;
    }
    .input-row:focus-within { border-color: var(--accent); }

    #message-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 0.9rem;
      line-height: 1.5;
      resize: none;
      max-height: 160px;
      overflow-y: auto;
      font-family: inherit;
    }
    #message-input::placeholder { color: var(--text-muted); }

    .btn-send {
      width: 36px; height: 36px;
      background: var(--accent);
      border: none;
      border-radius: 9px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-send:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-send:active:not(:disabled) { transform: scale(0.95); }
    .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────────────── -->
<header>
  <div class="header-left">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/>
      <circle cx="9" cy="13" r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="15" cy="13" r="1.5" fill="currentColor" stroke="none"/>
    </svg>
    AI Chat
  </div>

  <div class="header-right">
    <select class="model-select" id="model-select" title="Select model">
      {% for m in models %}
      <option value="{{ m.id }}">{{ m.name }}</option>
      {% endfor %}
    </select>

    <div class="user-chip" title="{{ user.get('email', user.get('preferred_username', '')) }}">
      <div class="avatar" id="user-avatar">{{ (user.get('name', user.get('preferred_username', 'U')) or 'U')[0].upper() }}</div>
      <span class="user-name">{{ user.get('name') or user.get('preferred_username') or user.get('email', 'User') }}</span>
    </div>

    <a href="/logout" class="btn-logout">Sign out</a>
  </div>
</header>

<!-- ── Chat messages ────────────────────────────────────────────────────────── -->
<div class="chat-container" id="chat-container">
  <div class="empty-state" id="empty-state">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <p>Send a message to start the conversation.</p>
  </div>
</div>

<!-- ── Toolbar ──────────────────────────────────────────────────────────────── -->
<div class="toolbar">
  <div class="toolbar-left">
    <button class="btn-clear" id="btn-clear" title="Clear chat history">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
      </svg>
      Clear chat
    </button>

    <div class="history-control">
      <span>Max history:</span>
      <select class="history-select" id="history-select" title="Maximum conversation turns to keep">
        <option value="10">10</option>
        <option value="12">12</option>
        <option value="14">14</option>
        <option value="16">16</option>
        <option value="18">18</option>
        <option value="20" selected>20</option>
      </select>
    </div>
  </div>

  <span class="msg-count" id="msg-count"></span>
</div>

<!-- ── Input ────────────────────────────────────────────────────────────────── -->
<div class="input-area">
  <div class="input-row">
    <textarea
      id="message-input"
      rows="1"
      placeholder="Message AI…"
      autocomplete="off"
      spellcheck="true"
    ></textarea>
    <button class="btn-send" id="btn-send" title="Send (Enter)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<script>
  // ── State ─────────────────────────────────────────────────────────────────
  let messages = [];
  let isStreaming = false;

  const chatContainer = document.getElementById('chat-container');
  const emptyState = document.getElementById('empty-state');
  const msgInput = document.getElementById('message-input');
  const btnSend = document.getElementById('btn-send');
  const btnClear = document.getElementById('btn-clear');
  const modelSelect = document.getElementById('model-select');
  const historySelect = document.getElementById('history-select');
  const msgCount = document.getElementById('msg-count');

  // ── Init ──────────────────────────────────────────────────────────────────
  const saved = sessionStorage.getItem('chat_messages');
  if (saved) {
    try {
      messages = JSON.parse(saved);
      messages.forEach(m => appendMessage(m.role, m.content));
    } catch (_) { messages = []; }
  }

  const savedModel = sessionStorage.getItem('selected_model');
  if (savedModel) modelSelect.value = savedModel;

  const savedHistory = sessionStorage.getItem('max_history');
  if (savedHistory) historySelect.value = savedHistory;

  updateMsgCount();

  // ── Auto-resize textarea ──────────────────────────────────────────────────
  msgInput.addEventListener('input', () => {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 160) + 'px';
  });

  // ── Send on Enter (Shift+Enter = newline) ─────────────────────────────────
  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  btnSend.addEventListener('click', sendMessage);
  btnClear.addEventListener('click', clearChat);
  modelSelect.addEventListener('change', () => sessionStorage.setItem('selected_model', modelSelect.value));
  historySelect.addEventListener('change', () => sessionStorage.setItem('max_history', historySelect.value));

  // ── Core: send message ────────────────────────────────────────────────────
  async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || isStreaming) return;

    isStreaming = true;
    setInputEnabled(false);

    // Add user message
    messages.push({ role: 'user', content: text });
    appendMessage('user', text);
    msgInput.value = '';
    msgInput.style.height = 'auto';
    scrollToBottom();
    updateMsgCount();

    // Show typing indicator
    const typingRow = appendTyping();
    scrollToBottom();

    // Trim history to configured max (preserving pairs: user+assistant)
    const maxPairs = parseInt(historySelect.value, 10);
    const payload = trimMessages(messages, maxPairs);

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: payload, model: modelSelect.value, stream: true }),
      });

      typingRow.remove();

      // Check for non-stream error response
      if (!resp.ok || !resp.body) {
        const data = await resp.json().catch(() => ({}));
        const errMsg = data.message || `HTTP ${resp.status} error`;
        appendMessage('error', errMsg);
        messages.push({ role: 'assistant', content: `[Error] ${errMsg}` });
        persist();
        return;
      }

      // Check content-type — errors come back as JSON even on 2xx sometimes
      const ct = resp.headers.get('content-type') || '';
      if (ct.includes('application/json')) {
        const data = await resp.json();
        if (data.error) {
          appendMessage('error', data.message || 'Unknown error');
          messages.push({ role: 'assistant', content: `[Error] ${data.message}` });
          persist();
          return;
        }
      }

      // Stream the response
      const assistantContent = await streamResponse(resp);
      if (assistantContent) {
        messages.push({ role: 'assistant', content: assistantContent });
        persist();
        updateMsgCount();
      }

    } catch (err) {
      typingRow.remove();
      const msg = err.name === 'TypeError'
        ? 'Could not connect to the server. Is the app running?'
        : err.message;
      appendMessage('error', msg);
    } finally {
      isStreaming = false;
      setInputEnabled(true);
      msgInput.focus();
      scrollToBottom();
    }
  }

  // ── Stream reader ─────────────────────────────────────────────────────────
  async function streamResponse(resp) {
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullContent = '';

    const { row, bubble } = appendStreamingMessage();
    scrollToBottom();

    try {
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep incomplete trailing line

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed || !trimmed.startsWith('data:')) continue;

          const payload = trimmed.slice(5).trim();
          if (payload === '[DONE]') continue;

          let chunk;
          try { chunk = JSON.parse(payload); } catch (_) { continue; }

          // Handle error object in stream
          if (chunk.error) {
            const errText = typeof chunk.error === 'string'
              ? chunk.error
              : chunk.error.message || 'Stream error';
            bubble.classList.add('error-bubble');
            bubble.innerHTML = escapeHtml(errText);
            return null;
          }

          const delta = chunk.choices?.[0]?.delta?.content;
          if (delta) {
            fullContent += delta;
            renderContent(bubble, fullContent, true);
            scrollToBottom();
          }
        }
      }
    } finally {
      // Remove cursor
      renderContent(bubble, fullContent, false);
    }

    return fullContent || null;
  }

  // ── DOM helpers ───────────────────────────────────────────────────────────
  function appendMessage(role, content) {
    hideEmptyState();

    const row = document.createElement('div');
    row.className = `message-row ${role === 'user' ? 'user' : 'assistant'}`;

    const av = document.createElement('div');
    av.className = `msg-avatar ${role === 'user' ? 'user-av' : 'bot-av'}`;
    av.textContent = role === 'user' ? getInitial() : '✦';

    const bubble = document.createElement('div');
    bubble.className = 'message-bubble' + (role === 'error' ? ' error-bubble' : '');
    renderContent(bubble, content, false);

    row.appendChild(av);
    row.appendChild(bubble);
    chatContainer.appendChild(row);
    return row;
  }

  function appendStreamingMessage() {
    hideEmptyState();

    const row = document.createElement('div');
    row.className = 'message-row assistant';

    const av = document.createElement('div');
    av.className = 'msg-avatar bot-av';
    av.textContent = '✦';

    const bubble = document.createElement('div');
    bubble.className = 'message-bubble';

    row.appendChild(av);
    row.appendChild(bubble);
    chatContainer.appendChild(row);
    return { row, bubble };
  }

  function appendTyping() {
    hideEmptyState();
    const row = document.createElement('div');
    row.className = 'message-row assistant';

    const av = document.createElement('div');
    av.className = 'msg-avatar bot-av';
    av.textContent = '✦';

    const bubble = document.createElement('div');
    bubble.className = 'message-bubble';
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

    row.appendChild(av);
    row.appendChild(bubble);
    chatContainer.appendChild(row);
    return row;
  }

  function renderContent(bubble, text, streaming) {
    // Basic markdown: code blocks, inline code, bold, italic, newlines
    let html = escapeHtml(text)
      .replace(/```([\s\S]*?)```/g, (_, code) => `<pre style="background:var(--bg-input);padding:0.75rem;border-radius:8px;overflow-x:auto;margin:0.5rem 0;font-size:0.82em;line-height:1.5">${code}</pre>`)
      .replace(/`([^`]+)`/g, '<code style="background:var(--bg-input);padding:0.1em 0.35em;border-radius:4px;font-size:0.85em">$1</code>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/\n/g, '<br>');

    bubble.innerHTML = html + (streaming ? '<span class="cursor"></span>' : '');
  }

  function clearChat() {
    messages = [];
    persist();
    chatContainer.innerHTML = '';
    const es = document.createElement('div');
    es.className = 'empty-state';
    es.id = 'empty-state';
    es.innerHTML = `
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <p>Send a message to start the conversation.</p>`;
    chatContainer.appendChild(es);
    updateMsgCount();
  }

  function hideEmptyState() {
    const es = document.getElementById('empty-state');
    if (es) es.remove();
  }

  function scrollToBottom() {
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function setInputEnabled(enabled) {
    msgInput.disabled = !enabled;
    btnSend.disabled = !enabled;
    btnClear.disabled = !enabled;
  }

  function updateMsgCount() {
    const turns = Math.floor(messages.length / 2);
    const max = parseInt(historySelect.value, 10);
    msgCount.textContent = messages.length > 0 ? `${turns} / ${max} turns` : '';
  }

  // Keep only the last N user+assistant pairs (system messages always kept)
  function trimMessages(msgs, maxPairs) {
    const system = msgs.filter(m => m.role === 'system');
    const convo = msgs.filter(m => m.role !== 'system');
    const trimmed = convo.slice(-(maxPairs * 2));
    return [...system, ...trimmed];
  }

  function persist() {
    sessionStorage.setItem('chat_messages', JSON.stringify(messages));
  }

  function getInitial() {
    const name = document.getElementById('user-avatar').textContent;
    return name || 'U';
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
