<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Error — AI Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d0d; color: #e5e5e5;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #1a1a1a; border: 1px solid #333; border-radius: 12px;
      padding: 2.5rem 3rem; max-width: 480px; width: 90%; text-align: center;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.3rem; color: #f87171; margin-bottom: 0.75rem; }
    p { color: #9ca3af; line-height: 1.6; margin-bottom: 1.5rem; }
    a {
      display: inline-block; padding: 0.6rem 1.4rem;
      background: #2563eb; color: #fff; border-radius: 8px;
      text-decoration: none; font-size: 0.9rem; transition: background 0.2s;
    }
    a:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚠️</div>
    <h1>Authentication Error</h1>
    <p>{{ message }}</p>
    <a href="/login">Try again</a>
  </div>
</body>
</html>
